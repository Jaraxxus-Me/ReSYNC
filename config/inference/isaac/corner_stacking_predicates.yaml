predicates:
  - name: "b_sc1p1"
    types: ["robot", "box"]
    ae_generator:
      name: "exhaustive"
      kwargs:
        search_region: [0, 0, 1]
        ae_var_ids: [0, 0]
    nn_archi:
      type: "Pos_MLP"
      input_dim: 3
      layer_size: 128
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.0001
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 120
        gamma: 0.1
    batch_size: 256
    num_epochs: 200
    cls_threshold: 0.5
    val_loss_thresh: 0.05
    train_loss_thresh: 0.1
    val_freq: 10

  - name: "b_sc1p2"
    types: ["block", "box"]
    ae_generator:
      name: "exhaustive"
      kwargs:
        search_region: [0, 0, 1]
        ae_var_ids: [0, 0]
    nn_archi:
      type: "IsaacPoseMLP"
      input_dim: 7
      layer_size: 128
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.0005
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 120
        gamma: 0.1
    batch_size: 256
    num_epochs: 200
    cls_threshold: 0.5
    val_loss_thresh: 0.07
    train_loss_thresh: 0.1
    val_freq: 10