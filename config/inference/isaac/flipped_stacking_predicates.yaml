predicates:
  # Robot/block relation connecting MoveToFlip to Flip. The action ordering is
  # alphabetical: Flip, MoveToFlip, Pick, Place.
  - name: "b_sc1p1"
    types: ["robot", "block"]
    ae_generator:
      name: "exhaustive"
      kwargs:
        search_region: [0, 1, 0, 0]
        ae_var_ids: [0, 0]
    nn_archi:
      type: "IsaacPoseMLP"
      input_dim: 7
      layer_size: 128
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.0005
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 120
        gamma: 0.1
    batch_size: 256
    num_epochs: 200
    cls_threshold: 0.5
    val_loss_thresh: 0.05
    train_loss_thresh: 0.1
    val_freq: 10

  # Unary block-orientation predicate. Only Flip is allowed to change it.
  - name: "u_sc1p1"
    types: ["block"]
    ae_generator:
      name: "exhaustive"
      kwargs:
        search_region: [1, 0, 0, 0]
        ae_var_ids: [0]
    nn_archi:
      type: "UpAxisMLP"
      input_dim: 7
      layer_size: 128
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.0005
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 120
        gamma: 0.1
    batch_size: 256
    num_epochs: 200
    cls_threshold: 0.5
    val_loss_thresh: 0.07
    train_loss_thresh: 0.1
    val_freq: 10
