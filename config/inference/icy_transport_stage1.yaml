scenarios:
  1:
    trained: false
    tgt_skill: IcyDrive(robot,transport_obj,icy_region)
    failed_skill: GoToPickObject
    failed_objects: robot,transport_obj1
    basic_type: transport_obj
    max_rl_steps: 30
    rl_static_steps: 20
    max_skill_steps: 1500
    train_objects: robot,transport_obj1,icy_region
    basic_objects: transport_obj1
    planner_learning_cfg_settings:
      num_envs: 8
      scenario: '1'
      middle_state_method: naive_init
      specified_task_path: config/specified_tasks/icy_transport
      real_scenario_name: sc1_pre_n1
      num_middle_states: 20
      rl_config: config/pure_rl/icy_transport_ppoc_sc1.yaml
      predicate_config: config/predicates/icy_transport_confined_enu_sc1.yaml
      force_skip_pred_learning: true
      icy_infront_of_transport1: true
      icy_infront_of_transport2: false
      icy_infront_of_target: false
      icy_transport_reach_drift_trans: 0.01
      icy_transport_reach_drift_rot: 0.003
      num_train_episodes_planner: 600
      num_failed_episodes_planner: 12
      num_train_episodes_planner_before_dreaming: 100
      pred_search_num_trajectories: 50
      pred_search_operator_learning_out_of_sample_penalty: 0.0
      max_env_steps: 4000
      planner_num_traj: 5
      pre_trained_policy_path: inference_assets/icy_transport/policies/stage1.pt
      pred_net_save_dir: inference_assets/icy_transport/predicates/stage1
      inference_dataset_path: inference_assets/icy_transport/datasets/stage1
