scenarios:
  1:
    trained: true
    tgt_skill: Punch(robot,block,obstruction_rec)
    failed_skill: ReachToGrasp
    failed_objects: robot,grasp_block
    basic_type: block
    max_rl_steps: 10
    rl_static_steps: 3
    max_env_steps: 200
    train_objects: robot,grasp_block,obstruction_rec
    basic_objects: grasp_block
    planner_learning_cfg_settings:
      num_envs: 1
      scenario: '1'
      middle_state_method: naive_init
      real_scenario_name: sc1_pre_n1
      num_middle_states: 20
      rl_config: config/pure_rl/blocked_stacking_ppoc_sc1.yaml
      pre_trained_policy_path: inference_assets/blocked_stacking/policies/stage1.pt
      predicate_config: config/predicates/blocked_stacking_confined_enu_sc1.yaml
      obstruction1_blocking_grasp: true
      obstruction1_blocking_stacking: false
      blocked2d_reach_drift_trans: 0.01
      blocked2d_reach_drift_rot: 0.003
      pred_net_save_dir: inference_assets/blocked_stacking/predicates/stage2
      force_skip_pred_learning: true
      num_train_episodes_planner: 1000
      num_failed_episodes_planner: 40
      num_train_episodes_planner_before_dreaming: 100
      pred_search_num_trajectories: 100
      max_env_steps: 300
      planner_num_traj: 5
      inference_dataset_path: inference_assets/blocked_stacking/datasets/stage1
  2:
    trained: false
    tgt_skill: Wiggle(robot,block,obstruction_tra)
    failed_skill: ReachToGrasp_Punch
    failed_objects: robot,grasp_block,obstruction_rec
    basic_objects: grasp_block,grasp_block
    basic_type: block
    max_rl_steps: 8
    rl_static_steps: 3
    max_skill_steps: 200
    train_objects: robot,grasp_block,obstruction_tra
    planner_learning_cfg_settings:
      num_envs: 1
      scenario: 1,2
      middle_state_method: naive_init
      real_scenario_name: sc1_pre_n1_sc2_pre_n1
      num_middle_states: 20
      rl_config: config/pure_rl/blocked_stacking_ppoc_sc12_2.yaml
      pre_trained_policy_path: inference_assets/blocked_stacking/policies/stage2.pt
      predicate_config: config/predicates/blocked_stacking_confined_enu_sc12_2.yaml
      obstruction1_blocking_grasp: true
      obstruction1_blocking_stacking: false
      obstruction2_blocking_grasp: true
      obstruction2_blocking_stacking: false
      blocked2d_reach_drift_trans: 0.01
      blocked2d_reach_drift_rot: 0.003
      pred_net_save_dir: inference_assets/blocked_stacking/predicates/stage2
      force_skip_pred_learning: true
      quantify_basic: false
      filter_preconditions: true
      num_train_episodes_planner: 2000
      num_failed_episodes_planner: 160
      num_train_episodes_planner_before_dreaming: 100
      pred_search_num_trajectories: 400
      max_env_steps: 400
      planner_num_traj: 200
      inference_dataset_path: inference_assets/blocked_stacking/datasets/stage2
