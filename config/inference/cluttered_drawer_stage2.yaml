scenarios:
  1:
    trained: true
    tgt_skill: Pull(robot,hammer,drawer)
    failed_skill: HandReachToGrasp
    failed_objects: robot,grasp_hammer
    basic_type: hammer
    max_rl_steps: 16
    rl_static_steps: 3
    max_skill_steps: 250
    max_env_steps: 550
    train_objects: robot,grasp_hammer,drawer
    basic_objects: grasp_hammer
    planner_learning_cfg_settings:
      num_envs: 16
      scenario: '1'
      dreaming_noise_base_var: 0.0
      middle_state_method: naive_init
      real_scenario_name: sc1_pre_n1
      num_middle_states: 20
      pre_trained_policy_path: inference_assets/cluttered_drawer/policies/stage1.pt
      predicate_config: config/predicates/cluttered_drawer_confined_enu_sc1.yaml
      rl_config: config/pure_rl/cluttered_drawer_ppoc_sc1.yaml
      drawer_blocking_grasp: true
      drawer_blocking_stacking: false
      pred_net_save_dir: inference_assets/cluttered_drawer/predicates/stage2
      force_skip_pred_learning: true
      num_train_episodes_planner: 1000
      num_failed_episodes_planner: 40
      num_train_episodes_planner_before_dreaming: 100
      pred_search_num_trajectories: 100
      max_env_steps: 550
      planner_num_traj: 5
      inference_dataset_path: inference_assets/cluttered_drawer/datasets/stage1
  2:
    trained: false
    tgt_skill: Wiggle(robot,hammer,block)
    failed_skill: HandReachToGrasp
    failed_objects: robot,grasp_hammer
    basic_objects: grasp_hammer,grasp_hammer
    basic_type: hammer
    max_rl_steps: 12
    rl_static_steps: 3
    max_skill_steps: 700
    train_objects: robot,grasp_hammer,block
    planner_learning_cfg_settings:
      num_envs: 8
      scenario: 1,2
      dreaming_noise_base_var: 0.0
      middle_state_method: naive_init
      specified_task_path: config/specified_tasks/cluttered_drawer
      real_scenario_name: sc1_pre_n1_sc2_pre_n1
      num_middle_states: 20
      rl_config: config/pure_rl/cluttered_drawer_ppoc_sc12_2.yaml
      pre_trained_policy_path: inference_assets/cluttered_drawer/policies/stage2.pt
      predicate_config: config/predicates/cluttered_drawer_confined_enu_sc12_2.yaml
      drawer_blocking_grasp: true
      drawer_blocking_stacking: false
      block_blocking_grasp: true
      block_blocking_stacking: false
      pred_net_save_dir: inference_assets/cluttered_drawer/predicates/stage2
      force_skip_pred_learning: true
      quantify_basic: false
      max_consecutive_failures: 8
      num_train_episodes_planner: 1280
      num_failed_episodes_planner: 128
      num_train_episodes_planner_before_dreaming: 100
      pred_search_num_trajectories: 100
      max_env_steps: 800
      planner_num_traj: 5
      inference_dataset_path: inference_assets/cluttered_drawer/datasets/stage2
