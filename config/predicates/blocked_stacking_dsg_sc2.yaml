predicates:
  - name: "terminal_reachtograsp_wiggle"
    types: ["robot", "block", "obstruction_tra"]
    ae_generator:
      name: "fixed"
      kwargs:
        ae_vectors: [[1, 0]]
        ae_var_ids: [[0, 0, 0]]
    nn_archi:
      type: "MLP"
      input_dim: 24
      layer_size: 128
      initializer: "xavier"
    optimizer:
      type: "AdamW"
      kwargs:
        lr: 0.001
    lr_scheduler:
      type: "StepLR"
      kwargs:
        step_size: 40
        gamma: 0.1
    batch_size: 128
    num_epochs: 500
    cls_threshold: 0.5
    val_loss_thresh: 0.1
    val_freq: 10
